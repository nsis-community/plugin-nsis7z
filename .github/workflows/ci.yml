name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build plug-in
        uses: nsis-dev/release-package@ebe53b3b0a66177ed65d6accc94d466ee8881c16 # v0.3.0
        with:
          name: nsis7z
          sources: |
            Contrib/nsis7z/Bundles/Nsis7z/StdAfx.cpp
            Contrib/nsis7z/Bundles/Nsis7z/nsis7z.cpp
            Contrib/nsis7z/Bundles/Nsis7z/resource.rc
            Contrib/nsis7z/UI/Common/WorkDir.cpp
            Contrib/nsis7z/UI/NSIS/ExtractCallbackConsole.cpp
            Contrib/nsis7z/UI/NSIS/Main.cpp
            Contrib/nsis7z/UI/NSIS/MainAr.cpp
            Contrib/nsis7z/UI/NSIS/NSISBreak.cpp
            Contrib/nsis7z/UI/NSIS/OpenCallbackConsole.cpp
            Contrib/nsis7z/UI/NSIS/UserInputUtils.cpp
          release: ${{ github.event_name == 'release' }}
